<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星辰大海 · 首页</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #a78bfa;
      --line: #334155;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(56, 189, 248, 0.15), transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(167, 139, 250, 0.15), transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 56px;
    }

    .hero .badge {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 6px 20px;
      border-radius: 30px;
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 7vw, 4.5rem);
      font-weight: 700;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 560px;
      margin: 0 auto;
    }

    .divider {
      width: 70px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 3px;
      margin: 28px auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      max-width: 960px;
      width: 100%;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 34px 28px;
      transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 20px 45px rgba(56, 189, 248, 0.15);
    }

    .card .icon {
      font-size: 2.4rem;
      display: block;
      margin-bottom: 18px;
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .card p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .cta {
      margin-top: 56px;
      display: inline-block;
      padding: 14px 40px;
      border-radius: 40px;
      background: linear-gradient(135deg, #38bdf8, #a78bfa);
      color: #fff;
      font-weight: 600;
      letter-spacing: 2px;
      text-decoration: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .cta:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(56, 189, 248, 0.35);
    }

    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <header class="hero">
    <span class="badge">Explore</span>
    <h1>星辰大海</h1>
    <div class="divider"></div>
    <p>仰望星空，脚踏实地。每一次出发，都是为了遇见更好的自己与更广阔的世界。</p>
  </header>

  <main class="grid">
    <section class="card">
      <span class="icon">🚀</span>
      <h2>探索未知</h2>
      <p>保持好奇，勇敢尝试。未知的领域里，藏着无限的可能与惊喜。</p>
    </section>
    <section class="card">
      <span class="icon">🌌</span>
      <h2>追逐梦想</h2>
      <p>梦想是夜空中最亮的星，照亮前行的路，指引我们跨越山海。</p>
    </section>
    <section class="card">
      <span class="icon">🌟</span>
      <h2>成就非凡</h2>
      <p>把每一件平凡的小事做到极致，终将汇聚成属于自己的璀璨星河。</p>
    </section>
  </main>

  <a href="#" class="cta">开始旅程</a>

  <footer>心有星辰，未来可期</footer>
</body>
</html>
